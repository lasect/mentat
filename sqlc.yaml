version: "2"
sql:
  - engine: "postgresql"
    schema: "scripts/migrations/app"
    queries: "internal/appdb/queries"
    gen:
      go:
        package: "appdb"
        out: "internal/appdb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
